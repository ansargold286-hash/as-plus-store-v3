<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AS Plus Limited - App Store</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-2: #f0f4f9;
      --ink: #1f1f1f;
      --muted: #5f6368;
      --line: #e3e3e3;
      --blue: #0b57d0;
      --blue-hover: #0842a0;
      --pill-active: #c2e7ff;
      --pill-ink: #001d35;
      --nav-pill: #d3e3fd;
      --star: #1f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 16px 8px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 920px;
      margin: 0 auto 10px;
    }

    .store-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.08rem;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 22px solid #0b57d0;
      position: relative;
      display: inline-block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .badge-dot-wrap {
      position: relative;
      font-size: 1.25rem;
      color: var(--ink);
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 4px;
      line-height: 1;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -4px;
      background: #b3261e;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Search Bar */
    .search-wrap {
      max-width: 920px;
      margin: 8px auto 14px;
      padding: 0 16px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .main-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Featured Hero / New Apps Auto-Scroll Section */
    .featured-card {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .featured-banner {
      background: linear-gradient(125deg, #2d1b69 0%, #6a1b9a 52%, #0b57d0 100%);
      padding: 14px 14px 10px;
      color: #fff;
    }

    .featured-banner-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .featured-banner-head h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
      font-weight: 700;
    }

    .featured-badge-pill {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .new-apps-track {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0 4px;
    }

    .new-apps-track::-webkit-scrollbar {
      display: none;
    }

    .new-app-slide {
      flex: 0 0 calc((100% - 16px) / 3);
      min-width: 0;
      background: #ffffff;
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .new-app-slide-title {
      font-weight: 700;
      font-size: 0.78rem;
      line-height: 1.2;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .new-app-slide-sub {
      font-size: 0.68rem;
      color: var(--muted);
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .new-app-slide .btn-pill-download {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.74rem;
    }

    .featured-footer {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
    }

    .featured-app-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      min-width: 0;
    }

    .app-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.35rem;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14);
    }

    .app-icon-box.small-slide-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      font-size: 1.1rem;
    }

    .app-icon-box.has-logo {
      background: #ffffff;
    }

    .app-icon-box img,
    .detail-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .featured-title {
      font-weight: 700;
      font-size: 0.94rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .featured-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn-pill-download {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-pill-download:hover {
      background: var(--blue-hover);
    }

    /* Section Title */
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 14px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .browse-more-divider {
      margin: 12px 0 4px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
    }

    .search-notice {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 6px 0 2px;
    }

    /* Suggested Apps Vertical List */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app-row-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .app-row-card:hover {
      background: var(--surface);
    }

    .app-row-info {
      flex: 1;
      min-width: 0;
    }

    .app-row-title {
      font-weight: 600;
      font-size: 1rem;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-row-cat {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .app-row-stats {
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 600;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .source-tag {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* Notification Dashboard Modal */
    .notif-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 70;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 16px 24px;
    }

    .notif-backdrop.open {
      display: flex;
    }

    .notif-panel {
      width: 100%;
      max-width: 520px;
      max-height: 75vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      padding: 16px;
    }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .notif-head h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .notif-sub {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      background: var(--surface);
    }

    .notif-item:hover {
      background: var(--surface-2);
    }

    .notif-item-body {
      flex: 1;
      min-width: 0;
    }

    .notif-item-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .notif-item-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .notif-empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 8px;
      font-size: 0.9rem;
    }

    /* App Detail Full Screen Overlay */
    .detail-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 60;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 36px;
    }

    .detail-screen.open {
      display: flex;
    }

    .detail-topbar {
      position: sticky;
      top: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 5;
    }

    .icon-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.3rem;
      padding: 6px;
      border-radius: 50%;
      cursor: pointer;
    }

    .detail-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 6px 18px 24px;
    }

    .detail-hero {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .detail-icon.has-logo {
      background: #ffffff;
    }

    .detail-title {
      margin: 0 0 4px;
      font-size: 1.5rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .detail-dev {
      color: var(--blue);
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .detail-tag {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* 3-Column Metrics Strip */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
      padding: 6px 0;
    }

    .metric-cell {
      border-right: 1px solid var(--line);
      padding: 0 8px;
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .metric-top {
      font-weight: 700;
      font-size: 0.96rem;
      margin-bottom: 2px;
    }

    .metric-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .age-box {
      display: inline-block;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      padding: 0 5px;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Full Width Download Button */
    .btn-download-full {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 999px;
      margin-bottom: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-download-full:hover {
      background: var(--blue-hover);
    }

    /* Promo / Preview Card */
    .preview-banner {
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      background: linear-gradient(120deg, #0b57d0 0%, #1a73e8 55%, #00838f 100%);
      margin-bottom: 22px;
      box-shadow: 0 3px 10px rgba(11, 87, 208, 0.2);
    }

    .preview-banner h4 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .preview-banner p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    /* Optional Screenshots Gallery */
    .screenshots-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .screenshot-img {
      height: 220px;
      width: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      object-fit: cover;
      flex-shrink: 0;
    }

    .about-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .about-head h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .about-body {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--ink);
      font-weight: 600;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 8px 6px 10px;
      z-index: 25;
    }

    .nav-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .nav-pill {
      width: 56px;
      height: 32px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .nav-item.active .nav-pill {
      background: var(--nav-pill);
      color: var(--pill-ink);
    }
  </style>
</head>
<body>

  <!-- Top Store Bar -->
  <header class="top-bar">
    <div class="top-row">
      <div class="store-brand">
        <span class="play-triangle"></span>
        <span>AS Plus Store</span>
      </div>

      <div class="top-actions">
        <div class="badge-dot-wrap" id="downloadStatusWrap" title="Downloads">
          <span id="downloadStatusIcon">&#11015;</span>
          <span class="badge-dot" id="downloadStatusCount">0</span>
        </div>
        <button type="button" class="badge-dot-wrap" id="notifBtn" title="Notifications" aria-label="Notifications">
          <span>&#128276;</span>
          <span class="badge-dot" id="notifBadge">0</span>
        </button>
        <div class="avatar-circle" title="Muhammad Ansar">A</div>
      </div>
    </div>
  </header>

  <!-- Search Input -->
  <div class="search-wrap" id="searchSection">
    <input
      type="search"
      id="searchInput"
      class="search-input"
      placeholder="Search apps, tools, games..."
    />
  </div>

  <!-- Home Content -->
  <main class="main-wrap" id="homeView">
    <!-- Featured / New Apps Auto-Scroll Card -->
    <section class="featured-card" id="featuredCard"></section>

    <!-- Suggested / Search Results Section -->
    <div class="section-heading">
      <h3 id="listTitle">Suggested for you</h3>
      <span class="section-sub" id="appCounter"></span>
    </div>

    <section class="apps-list" id="appsList"></section>
  </main>

  <!-- Bell Notification Dashboard -->
  <div class="notif-backdrop" id="notifBackdrop" role="dialog" aria-modal="true" aria-label="New App Notifications">
    <div class="notif-panel">
      <div class="notif-head">
        <div>
          <h3>Notifications</h3>
          <div class="notif-sub">Newly added apps from the last 7 days</div>
        </div>
        <button type="button" class="icon-btn" id="closeNotifBtn" aria-label="Close notifications">&times;</button>
      </div>
      <div class="notif-list" id="notifList"></div>
    </div>
  </div>

  <!-- App Detail Full View -->
  <section class="detail-screen" id="detailScreen">
    <div class="detail-topbar">
      <button type="button" class="icon-btn" id="backBtn" aria-label="Back">&larr;</button>
      <div class="top-actions">
        <div class="badge-dot-wrap" id="detailDownloadStatusWrap" title="Downloads">
          <span id="detailDownloadStatusIcon">&#11015;</span>
          <span class="badge-dot" id="detailDownloadStatusCount">0</span>
        </div>
        <button type="button" class="icon-btn" aria-label="More">&#8942;</button>
      </div>
    </div>

    <div class="detail-container" id="detailContent"></div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-tab="Apps">
      <span class="nav-pill">&#8862;</span>
      <span>Apps</span>
    </button>
    <button type="button" class="nav-item" data-tab="Search">
      <span class="nav-pill">&#128269;</span>
      <span>Search</span>
    </button>
  </nav>

  <script>
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    function svgLogoDataUri(svgMarkup) {
      return "data:image/svg+xml;utf8," + encodeURIComponent(svgMarkup.trim());
    }

    const googleLogos = {

      `),
      gmail: svgLogoDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
          <rect width="108" height="108" fill="#ffffff"/>

          <path fill="#34A853" d="M73 78h11c2.2 0 4-1.8 4-4V39.5L73 50v28z"/>

          <path fill="#EA4335" d="M35 50V33l19 14.2L73 33v17L54 64.2 35 50z"/>
          <path fill="#C5221F" d="M20 35v4.5L35 50V33l-6.5-2.3C25 28 20 30.6 20 35z"/>
        </svg>
      `),
      maps: svgLogoDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
          <rect width="108" height="108" fill="#ffffff"/>
          <path fill="#1A73E8" d="M62.5 22.5C59.8 21.5 57 21 54 21c-8.5 0-16 4.3-20.5 10.8l12.8 10.8 16.2-20.1z"/>

    function getRecentNewApps(nowMs = Date.now()) {
      return apps.filter(app => {
        if (!app.addedAt) return false;
        const addedMs = Date.parse(app.addedAt);
        if (Number.isNaN(addedMs)) return false;
        const ageMs = nowMs - addedMs;
        return ageMs >= -86400000 && ageMs < SEVEN_DAYS_MS;
      });
    }

    function formatRelativeAddedTime(addedAt, nowMs = Date.now()) {
      const addedMs = Date.parse(addedAt);
      if (Number.isNaN(addedMs)) return "Recently added";
      const diffHours = Math.max(0, Math.floor((nowMs - addedMs) / (60 * 60 * 1000)));
      if (diffHours < 1) return "Added today";
      if (diffHours < 24) return `Added ${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      return diffDays === 1 ? "Added 1 day ago" : `Added ${diffDays} days ago`;
    }

    function stopAutoScroll() {
      if (autoScrollFrameId !== null) {
        cancelAnimationFrame(autoScrollFrameId);
        autoScrollFrameId = null;
      }
    }

    function startNewAppsAutoScroll(track) {
      stopAutoScroll();
      if (!track) return;

      let lastTime = performance.now();
      const speedPxPerSec = 28;

      function step(now) {
        const dt = Math.min(64, now - lastTime) / 1000;
        lastTime = now;

        const maxScroll = track.scrollWidth - track.clientWidth;
        if (!autoScrollPaused && maxScroll > 2) {
          track.scrollLeft += autoScrollDirection * speedPxPerSec * dt;
          if (track.scrollLeft >= maxScroll - 1) {
            autoScrollDirection = -1;
          } else if (track.scrollLeft <= 1) {
            autoScrollDirection = 1;
          }
        }
        autoScrollFrameId = requestAnimationFrame(step);
      }

      track.addEventListener("mouseenter", () => { autoScrollPaused = true; });
      track.addEventListener("mouseleave", () => { autoScrollPaused = false; });
      track.addEventListener("touchstart", () => { autoScrollPaused = true; }, { passive: true });
      track.addEventListener("touchend", () => {
        setTimeout(() => { autoScrollPaused = false; }, 1200);
      }, { passive: true });

      autoScrollFrameId = requestAnimationFrame(step);
    }

    function getOrderedSearchPartition(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        return { matched: apps, others: [], hasQuery: false };
      }

      const prefixName = [];
      const containsName = [];
      const metaMatch = [];
      const others = [];

      apps.forEach(app => {
        const nameLower = app.name.toLowerCase();
        const devLower = app.developer.toLowerCase();
        const catLower = app.category.toLowerCase();
        const aboutLower = app.about.toLowerCase();

        if (nameLower.startsWith(q)) {
          prefixName.push(app);
        } else if (nameLower.includes(q)) {
          containsName.push(app);
        } else if (devLower.includes(q) || catLower.includes(q) || aboutLower.includes(q)) {
          metaMatch.push(app);
        } else {
          others.push(app);
        }
      });

      return {
        matched: [...prefixName, ...containsName, ...metaMatch],
        others,
        hasQuery: true
      };
    }

    function renderStore() {
      const { matched, others, hasQuery } = getOrderedSearchPartition(searchText);

      listTitle.textContent = (activeTab === "Search" || hasQuery) ? "Search results" : "Suggested for you";
      appCounter.textContent = hasQuery
        ? `${matched.length} match${matched.length === 1 ? "" : "es"}`
        : `${apps.length} apps`;

      appsList.innerHTML = "";

      if (!hasQuery) {
        apps.forEach(app => appsList.appendChild(createAppRowElement(app)));
        return;
      }

      if (matched.length === 0) {
        const emptyNotice = document.createElement("div");
        emptyNotice.className = "search-notice";
        emptyNotice.textContent = `No exact matches for "${searchText.trim()}".`;
        appsList.appendChild(emptyNotice);
      } else {
        matched.forEach(app => appsList.appendChild(createAppRowElement(app)));
      }

      if (others.length > 0) {
        const divider = document.createElement("div");
        divider.className = "browse-more-divider";
        divider.textContent = matched.length > 0 ? "More apps on AS Plus Store" : "Browse apps from home";
        appsList.appendChild(divider);

        others.forEach(app => appsList.appendChild(createAppRowElement(app)));
      }
    }

    function openAppDetail(id) {
      const app = apps.find(item => item.id === id);
      if (!app) return;

      const screenshotsHtml = Array.isArray(app.screenshots) && app.screenshots.length > 0
        ? `<div class="screenshots-strip">${app.screenshots.map((src, idx) => `<img class="screenshot-img" src="${src}" alt="${app.name} screenshot ${idx + 1}" />`).join("")}</div>`
        : "";

      const col1Top = app.rating ? `${app.rating} &#9733;` : app.version;
      const col1Sub = app.rating ? app.reviews : (app.isPlayStore ? "Official Listing" : "Version");

      const col3Top = app.sizeLabel
        ? app.sizeLabel
        : (app.isPlayStore ? "Play Store" : "Direct APK");
      const col3Sub = app.sizeLabel
        ? "APK Size"
        : (app.isPlayStore ? "Varies by device" : "Exact size not set");

      const chips = [
        `<span class="meta-chip">${app.category}</span>`,
        `<span class="meta-chip">${app.isPlayStore ? "Google Play Store" : `Version ${app.version}`}</span>`
      ];
      if (app.sizeLabel) {
        chips.push(`<span class="meta-chip">${app.sizeLabel}</span>`);
      }

      detailContent.innerHTML = `
        <div class="detail-hero">
          ${renderAppIcon(app, "detail-icon")}
          <div>
            <h1 class="detail-title">${app.name}</h1>
            <div class="detail-dev">${app.developer}</div>
            <div class="detail-tag">${app.isPlayStore ? "Official Google Play" : "Direct APK"} &bull; ${app.version}</div>
          </div>
        </div>

        <div class="metrics-bar">
          <div class="metric-cell">
            <div class="metric-top">${col1Top}</div>
            <div class="metric-sub">${col1Sub}</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top"><span class="age-box">${app.ageRating}</span></div>
            <div class="metric-sub">Rated for ${app.ageRating}</div>
          </div>
          <div class="metric-cell">
            <div class="metric-top">${col3Top}</div>
            <div class="metric-sub">${col3Sub}</div>
          </div>
        </div>

        <button type="button" class="btn-download-full" id="detailDownloadBtn">Download</button>

        <div class="preview-banner">
          <h4>${app.promoTitle}</h4>
          <p>${app.promoText}</p>
        </div>

        ${screenshotsHtml}

        <div class="about-head">
          <h3>About this app</h3>
          <span>&rarr;</span>
        </div>
        <p class="about-body">${app.about}</p>

        <div class="meta-chips">
          ${chips.join("")}
        </div>
      `;

      document.getElementById("detailDownloadBtn").addEventListener("click", () => {
        triggerDownloadState(app.downloadUrl);
      });

      detailScreen.classList.add("open");
      detailScreen.scrollTop = 0;
    }

    backBtn.addEventListener("click", () => {
      detailScreen.classList.remove("open");
    });

    notifBtn.addEventListener("click", () => {
      updateNotificationsDashboard();
      notifBackdrop.classList.add("open");
    });

    closeNotifBtn.addEventListener("click", () => {
      notifBackdrop.classList.remove("open");
    });

    notifBackdrop.addEventListener("click", e => {
      if (e.target === notifBackdrop) {
        notifBackdrop.classList.remove("open");
      }
    });

    searchInput.addEventListener("input", e => {
      searchText = e.target.value;
      renderStore();
    });

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        if (activeTab === "Search") {
          searchSection.style.display = "block";
          searchInput.focus();
        }
        renderStore();
      });
    });

    updateDownloadIndicator();
    updateNotificationsDashboard();
    renderFeatured();
    renderStore();
  </script>
</body>
</html>
